name: wave-production
# Lives in ~/wave-production on the server next to api.py, nginx.conf and an optional .env
# with JAMENDO_CLIENT_ID=... Images are pinned by digest and never pulled on `up`.
services:
  web:
    image: sha256:cd5bb7ea510c50a90cf91cd2476640a4294cfaa32533f56c1710331a4850a0e5
    pull_policy: never
    container_name: wave-production
    restart: unless-stopped
    volumes:
      - type: bind
        source: /srv/wave-jail/site
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  api:
    image: python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
    pull_policy: never
    container_name: wave-api
    restart: unless-stopped
    command: ["python", "-I", "/app/api.py"]
    env_file:
      - path: .env
        required: false
    environment:
      CACHE_DB: /data/cache.db
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ./api.py
        target: /app/api.py
        read_only: true
      - api-cache:/data
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  api-cache:
