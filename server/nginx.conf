server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    disable_symlinks on;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }

    # The server's own Creative Commons library (server/library.py). Files never change once written.
    location ^~ /media/ {
        alias /music/files/;
        types { audio/mpeg mp3; }
        default_type application/octet-stream;
        location ~ \.part$ { return 404; }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Catalog cache (server/api.py). Resolved per request through Docker DNS,
    # so the site keeps working while the api container restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
}
